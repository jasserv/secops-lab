# FortiGate-VM64-KVM v7.6.7 build 3704 - SecOPS Lab
# Reconstructed from lab documentation, NOT a device export. Verify against `show full-configuration`.
# Mode: NAT, single VDOM (root), standalone HA. Hostname and licence details intentionally omitted.

config system interface
    edit "port1"
        set mode static
        set ip 10.0.0.2 255.255.255.0
        set allowaccess ping https ssh
        set alias "OPNsense-OPT1"
        set description "Transit/DMZ side (upstream), bridge vmbr2"
    next
    edit "port2"
        set mode static
        set ip 10.50.10.1 255.255.255.0
        set allowaccess ping https ssh
        set alias "Corporate"
        set description "Gateway for 10.50.10.0/24, bridge vmbr3"
    next
end

config router static
    edit 1
        set gateway 10.0.0.1
        set device "port1"
        set comment "Default route to OPNsense OPT1"
    next
end

config firewall policy
    edit 1
        set name "port1-to-port2"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
    next
    edit 2
        set name "port2-to-port1"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
    next
end
